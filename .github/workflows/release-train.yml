name: Release Train

# Fully automated Friday MINOR release of @chemistry/crystalview to npm.
# Level 1 train: depends on the @chemistry base packages (released 20:00 Prague),
# so this runs an hour later at 21:00. Always a minor bump; internal @chemistry/*
# dependency changes alone justify a release.
#
# GITHUB_TOKEN caveat: its merges/tag-pushes never fire tag-triggered workflows,
# so after merging the release PR this train dispatches release.yml explicitly
# (workflow_dispatch releases the current package.json version).
on:
  schedule:
    # Friday 21:00 Europe/Prague across both DST offsets; the gate job filters.
    - cron: '0 19 * * 5'
    - cron: '0 20 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prague-gate:
    name: 🕘 Friday 21:00 Prague gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - name: Check local Prague hour (DST-proof)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "workflow_dispatch - bypassing hour gate."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=Europe/Prague date +%H)
          if [ "$HOUR" = "21" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Prague hour is $HOUR, not 21 - wrong DST cron slot, skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  merge-green-dependabot:
    name: 🤖 Merge passing dependabot PRs
    needs: prague-gate
    if: needs.prague-gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge green dependabot PRs, leave red open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # chemistry org has no shared triage automation, so the train owns dependabot merges here.
          PRS=$(gh pr list -R "$REPO" --author "app/dependabot" --state open --json number --jq '.[].number')
          if [ -z "$PRS" ]; then
            echo "No open dependabot PRs." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for PR in $PRS; do
            echo "Waiting for checks on PR #$PR to settle..."
            SETTLED=false
            for i in $(seq 1 20); do
              CHECKS=$(gh pr checks "$PR" -R "$REPO" --json bucket 2>/dev/null || true)
              PENDING=$(printf '%s' "$CHECKS" | jq '[.[] | select(.bucket == "pending")] | length' 2>/dev/null || echo 1)
              [ "$PENDING" = "0" ] && { SETTLED=true; break; }
              echo "  poll $i: $PENDING pending check(s)..."
              sleep 30
            done
            if [ "$SETTLED" != "true" ]; then
              echo "PR #$PR checks did not settle in ~10 min - leaving open." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            FAILED=$(printf '%s' "$CHECKS" | jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' 2>/dev/null || echo 1)
            if [ "$FAILED" = "0" ]; then
              gh pr merge "$PR" -R "$REPO" --squash --delete-branch \
                && echo "Merged dependabot PR #$PR." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "PR #$PR has $FAILED failing check(s) - leaving open." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

  release:
    name: 🚝 Cut minor release
    needs: [prague-gate, merge-green-dependabot]
    if: needs.prague-gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Skip if an open release PR exists
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/"))] | length')
          if [ "$EXISTING" != "0" ]; then
            echo "Open release PR already exists - a previous train is stuck. Skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump internal @chemistry/* dependencies
        id: deps
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Level 1: pull the freshest @chemistry base packages published an hour earlier.
          npx --yes npm-check-updates -u --dep prod,dev --filter "@chemistry/*"
          npm install
          if git diff --quiet -- package.json package-lock.json; then
            echo "No internal @chemistry/* dependency changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Internal @chemistry/* dependencies updated." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect releasable commits since the last tag
        id: detect
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          LAST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          RANGE=""; [ -n "$LAST_TAG" ] && RANGE="${LAST_TAG}..HEAD"
          echo "Last tag: ${LAST_TAG:-none}"
          SUBJECTS=$(git log $RANGE --no-merges --pretty=%s)
          # Releasable = anything except docs/ci/plain-chore; chore(deps) counts, chore(release) does not.
          RELEASABLE=$(printf '%s\n' "$SUBJECTS" \
            | grep -vE '^(docs|ci)(\([^)]*\))?!?:' \
            | grep -vE '^chore(\([^)]*\))?!?:' || true)
          DEPS=$(printf '%s\n' "$SUBJECTS" | grep -E '^chore\(deps' || true)
          COUNT=$(printf '%s\n%s\n' "$RELEASABLE" "$DEPS" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "No releasable commits since ${LAST_TAG:-repo start}."
            echo "releasable=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $COUNT releasable commit(s)."
            echo "releasable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to release
        id: decide
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.deps.outputs.changed }}" = "true" ] || [ "${{ steps.detect.outputs.releasable }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to release: no releasable commits and no dependency changes." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump minor version
        id: bump
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail
          NEW=$(npm version minor --no-git-tag-version)
          NEW="${NEW#v}"
          echo "New version: $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Verify (npm ci + full verify after dep bump)
        if: steps.bump.outputs.version
        run: |
          npm ci
          npm run verify

      - name: Create + merge release PR
        id: pr
        if: steps.bump.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(release): ${VERSION}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base master --head "$BRANCH" \
            --title "chore(release): ${VERSION}" \
            --body "Automated weekly minor release train. Bumps internal @chemistry/* deps and cuts minor ${VERSION}. Publish runs via release.yml (workflow_dispatch) after merge.")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          sleep 5
          if ! OUT=$(gh pr merge "$PR_URL" --auto --squash 2>&1); then
            echo "$OUT"
            echo "$OUT" | grep -q "clean status" && gh pr merge "$PR_URL" --squash || exit 1
          fi

      - name: Wait for release PR to merge
        if: steps.pr.outputs.pr_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            STATE=$(gh pr view "${{ steps.pr.outputs.pr_url }}" --json state --jq .state)
            [ "$STATE" = "MERGED" ] && { echo "Release PR merged."; exit 0; }
            echo "poll $i: PR state $STATE, waiting..."
            sleep 30
          done
          echo "Release PR not merged in ~10 min - not dispatching release." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Dispatch release workflow
        if: steps.pr.outputs.pr_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dispatch is mandatory: a GITHUB_TOKEN merge does not fire release.yml's tag-push trigger.
          gh workflow run release.yml --ref master --repo "${{ github.repository }}"
          echo "Released ${{ steps.bump.outputs.version }} - release.yml dispatched." >> "$GITHUB_STEP_SUMMARY"
